<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Наше свидание 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- ЭКРАН 1 -->
    <section class="screen active" id="screen1">

        <div class="bunny-box">
            <img src="images/5467856318774320644.jpg" class="bunny">
        </div>

        <h1>Хочешь пойти<br>со мной на свидание? 💗</h1>

        <div class="buttons">
            <button id="yesButton">Да 💕</button>
            <button id="noButton">Нет</button>
        </div>

    </section>


    <!-- ЭКРАН 2 -->
    <section class="screen" id="screen2">

        <h1>Урааа! 🥰</h1>
        <p>Тогда выбери, что будем есть 💗</p>

        <div class="cards">

            <button class="card food" data-value="Пицца 🍕">
                <span>🍕</span>
                <b>Пицца</b>
            </button>

            <button class="card food" data-value="Суши 🍣">
                <span>🍣</span>
                <b>Суши</b>
            </button>

            <button class="card food" data-value="Бургер 🍔">
                <span>🍔</span>
                <b>Бургер</b>
            </button>

            <button class="card food" data-value="Мороженое 🍦">
                <span>🍦</span>
                <b>Мороженое</b>
            </button>

        </div>

        <button class="next" id="foodNext">Дальше 💗</button>

    </section>


    <!-- ЭКРАН 3 -->
    <section class="screen" id="screen3">

        <h1>А чем займёмся? ✨</h1>

        <div class="cards">

            <button class="card activity" data-value="Кино 🎬">
                <span>🎬</span>
                <b>Кино</b>
            </button>

            <button class="card activity" data-value="Прогулка 🌸">
                <span>🌸</span>
                <b>Прогулка</b>
            </button>

            <button class="card activity" data-value="Игры 🎮">
                <span>🎮</span>
                <b>Игры</b>
            </button>

            <button class="card activity" data-value="Кафе ☕">
                <span>☕</span>
                <b>Кафе</b>
            </button>

        </div>

        <button class="next" id="activityNext">Дальше 💗</button>

    </section>


    <!-- ЭКРАН 4 -->
    <section class="screen" id="screen4">

        <h1>Выбери дату 📅</h1>

        <div class="choice-list">

            <button class="date" data-value="15 августа">
                15 августа
            </button>

            <button class="date" data-value="16 августа">
                16 августа
            </button>

            <button class="date" data-value="17 августа">
                17 августа
            </button>

            <button class="date" data-value="20 августа">
                20 августа
            </button>

        </div>

        <button class="next" id="dateNext">Дальше 💗</button>

    </section>


    <!-- ЭКРАН 5 -->
    <section class="screen" id="screen5">

        <h1>А во сколько? 🕐</h1>

        <div class="choice-list">

            <button class="time" data-value="16:00">
                16:00
            </button>

            <button class="time" data-value="17:30">
                17:30
            </button>

            <button class="time" data-value="19:00">
                19:00
            </button>

            <button class="time" data-value="20:30">
                20:30
            </button>

        </div>

        <button class="next" id="finishButton">
            Всё выбрала 💗
        </button>

    </section>


    <!-- ФИНАЛ -->
    <section class="screen" id="screen6">

        <div class="final-bunny">
            <img src="images/5467856318774320644.jpg">
        </div>

        <h1>УРААА! 🥰💗</h1>

        <p>Наше свидание состоится!</p>

        <div class="result">

            <p id="resultFood"></p>
            <p id="resultActivity"></p>
            <p id="resultDate"></p>
            <p id="resultTime"></p>

        </div>

        <div class="hearts">
            💕 💗 💕 💗 💕
        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
